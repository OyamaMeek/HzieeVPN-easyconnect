name: Build HZIEE VPN image

on:
  push:
    branches: [master]
    paths:
      - '**/*.go'
      - client/atrust/auth/*.html
      - client/atrust/auth/*.mjs
      - go.mod
      - go.sum
      - Dockerfile
      - Dockerfile.atrust
      - .dockerignore
      - deploy/hziee/**
      - .github/workflows/build-image.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Test Go client
        run: go test -mod=readonly ./...
      - name: Test captcha web
        run: python3 -B -m unittest discover -s deploy/hziee -p 'test_captcha_web.py' -v
      - name: Test QR login boundaries
        run: node --test deploy/hziee/test_dingtalk_message.mjs deploy/hziee/test_atrust_qr.cjs deploy/hziee/test_atrust_runtime.cjs
      - name: Validate deployment config
        run: |
          docker compose -f deploy/hziee/compose.headless.yaml config --quiet
          docker compose -f deploy/hziee/compose.dingtalk.yaml config --quiet
          docker compose -f deploy/hziee/compose.atrust.yaml config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: docker run --rm "$IMAGE" -version

  atrust-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish aTrust login web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.atrust
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:atrust-latest
            ${{ steps.image.outputs.name }}:atrust-sha-${{ github.sha }}
          build-args:
            COMMIT_ID=${{ github.sha }}
          cache-from: type=gha,scope=atrust
          cache-to: type=gha,scope=atrust,mode=max
      - name: Smoke test published aTrust image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:atrust-sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE" -c '
            set -euo pipefail
            test -f /opt/atrust-web/atrust_qr.cjs
            test -f /opt/atrust-web/atrust_qr.html
            test -f /usr/share/sangfor/aTrust/resources/app/src/main.before-qr.js
            grep -q "/opt/atrust-web/atrust_qr.cjs" /usr/share/sangfor/aTrust/resources/app/src/main.js
            test -x /usr/local/bin/keepalive-ping.sh
            test -x /usr/local/bin/start.sh
            test -x /usr/local/bin/start-sangfor.sh
            test -x /usr/local/bin/vpn-config.sh
            test "$ATRUST_SOCKS_PORT" = "1080"
            test "$PING_ADDR" = "10.130.10.75"
            test "$PING_ADDR_URL" = "http://10.130.10.75/"
            test "$PING_INTERVAL" = "60"
            eval "$(vpn-config.sh)"
            test "$FORCE_OPEN_PORTS" = "54631 58081"
            bash -c 'source /usr/local/bin/start.sh; VPN_TUN=lo render_danted_conf /tmp/danted-check.conf'
            grep -q '^clientmethod: none$' /tmp/danted-check.conf
            grep -q '^socksmethod: none$' /tmp/danted-check.conf
            grep -q 'from: 127.0.0.0/8 to: 0.0.0.0/0' /tmp/danted-check.conf
            grep -q 'client block {' /tmp/danted-check.conf
            /usr/sbin/danted -V -f /tmp/danted-check.conf
            rm -f /tmp/danted-check.conf
            command -v Xvfb danted tinyproxy socat iptables ip busybox >/dev/null
            test -f /usr/local/lib/fake-getlogin.so
            test -x /usr/share/sangfor/aTrust/aTrustTray
            test -x /usr/share/sangfor/aTrust/resources/bin/aTrustAgent
            ! LD_LIBRARY_PATH="/usr/share/sangfor/aTrust:/usr/share/sangfor/aTrust/resources/bin" ldd /usr/share/sangfor/aTrust/aTrustTray /usr/share/sangfor/aTrust/resources/bin/aTrustAgent /usr/sbin/danted /usr/bin/tinyproxy /usr/bin/Xvfb | grep -q "not found"
            for removed_cmd in tigervncserver tigervncpasswd flwm stalonetray xclip xmessage; do
              ! command -v "$removed_cmd" >/dev/null 2>&1
            done
            for removed_path in /usr/local/bin/novnc /usr/local/share/novnc /etc/tinyproxy-novnc.conf /usr/local/bin/get-vnc-clip.sh /usr/local/bin/set-vnc-clip.sh /usr/bin/xdg-open /usr/local/lib/fake-hwaddr.so /usr/share/sangfor/EasyConnect; do
              ! test -e "$removed_path"
            done
            mkdir -p /tmp/.X11-unix && chmod 1777 /tmp/.X11-unix
            Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
            xvfb_pid=$!
            for _ in $(seq 1 30); do
              [ -S /tmp/.X11-unix/X99 ] && break
              sleep 0.1
            done
            test -S /tmp/.X11-unix/X99
            kill "$xvfb_pid" && wait "$xvfb_pid" || true
          '
