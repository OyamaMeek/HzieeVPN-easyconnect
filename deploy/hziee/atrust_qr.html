<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aTrust 客户端 · 登录验证</title>
<style>
*{box-sizing:border-box}
body{font:15px/1.5 system-ui,-apple-system,sans-serif;background:#f4f6f9;color:#1f2328;margin:0;padding:24px 14px}
main{max-width:480px;margin:3vh auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;margin:0}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef2f7;color:#334155;font-weight:600}
.badge.online{background:#dcfce7;color:#166534}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;background:#f1f5f9;padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:#475569;padding:9px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.active{background:#fff;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,.08)}
[hidden]{display:none !important}
.field{margin-bottom:12px;text-align:left}
.field label{display:block;font-size:13px;color:#475569;margin-bottom:4px}
.field input{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.stage{position:relative;display:inline-block;max-width:100%;margin:10px auto;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#f8fafc;user-select:none;touch-action:manipulation}
.stage img{display:block;max-width:100%;height:auto;cursor:crosshair}
.marker{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#1769d2;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);pointer-events:none}
.center{text-align:center}
#qr{display:block;width:260px;height:260px;max-width:100%;margin:16px auto;image-rendering:pixelated;border:1px solid #e2e8f0;border-radius:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
button.primary{font:inherit;padding:9px 16px;border:0;border-radius:8px;background:#1769d2;color:#fff;cursor:pointer;font-weight:600}
button.secondary{font:inherit;padding:9px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#1f2328;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin:12px 0;padding:10px 12px;border-radius:8px;background:#f8fafc;color:#334155;font-size:14px;min-height:42px}
.status.ok{background:#dcfce7;color:#166534}
.status.err{background:#fee2e2;color:#991b1b}
.proxy-card{margin:0 0 18px;padding:14px 16px;border-radius:12px;background:#f0fdf4;border:1px solid #86efac;color:#14532d}
.proxy-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#166534}
.proxy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.proxy-item{background:#fff;border:1px solid #bbf7d0;border-radius:8px;padding:8px 10px}
.proxy-label{display:block;font-size:12px;color:#475569;margin-bottom:2px}
.proxy-value{display:inline-block;font:600 15px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#0f172a;user-select:all}
.proxy-meta{font-size:13px;font-weight:600;color:#166534}
small{display:block;color:#64748b;margin-top:18px;font-size:12px;text-align:center}
</style>
<main>
<header>
  <h1>aTrust 客户端登录</h1>
  <span id="clientBadge" class="badge">检查状态中</span>
</header>
<section id="socksInfo" class="proxy-card" hidden aria-live="polite">
  <div class="proxy-title">连接成功 · SOCKS5 开放端口</div>
  <div class="proxy-grid">
    <div class="proxy-item">
      <span class="proxy-label">SOCKS5 地址</span>
      <code id="socksAddress" class="proxy-value">127.0.0.1:1080</code>
    </div>
    <div class="proxy-item">
      <span class="proxy-label">开放端口</span>
      <code id="socksPort" class="proxy-value">1080</code>
    </div>
    <div class="proxy-item">
      <span class="proxy-label">账号密码</span>
      <span id="socksAuth" class="proxy-meta">无账号密码</span>
    </div>
    <div class="proxy-item">
      <span class="proxy-label">访问限制</span>
      <span id="socksScope" class="proxy-meta">仅允许本地连接（127.0.0.1）</span>
    </div>
  </div>
</section>
<div class="tabs" role="tablist">
  <button id="tabPassword" type="button" role="tab" aria-selected="true" class="active">密码登录</button>
  <button id="tabDingTalk" type="button" role="tab" aria-selected="false">钉钉扫码</button>
</div>

<section id="panelPassword">
  <div class="row">
    <div class="field">
      <label for="username">账号</label>
      <input id="username" type="text" autocomplete="username" placeholder="学号或工号（默认附加 @ShenLan）">
    </div>
    <div class="field">
      <label for="domain">登录域</label>
      <input id="domain" type="text" value="ShenLan" placeholder="ShenLan">
    </div>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="输入密码（仅发送到服务器官方客户端）">
  </div>
  <div class="center">
    <div id="captchaStage" class="stage" hidden>
      <img id="captchaImg" alt="官方密码登录图形验证码">
    </div>
  </div>
  <div id="pwdStatus" class="status" role="status">点击“获取验证码”从服务器官方客户端加载图形验证码，再依次点选提交。</div>
  <div class="actions">
    <button id="loadCaptcha" type="button" class="secondary">获取 / 刷新验证码</button>
    <button id="undoPoint" type="button" class="secondary" disabled>撤销一点</button>
    <button id="clearPoints" type="button" class="secondary" disabled>清空</button>
    <button id="submitPassword" type="button" class="primary" disabled>提交密码登录</button>
  </div>
</section>

<section id="panelDingTalk" class="center" hidden>
  <p>二维码在服务器端从官方 aTrust 客户端获取并映射到此页面，请使用钉钉扫码确认。</p>
  <img id="qr" alt="官方 aTrust 客户端当前钉钉二维码" hidden>
  <div id="qrStatus" class="status" role="status">正在读取官方 aTrust 客户端…</div>
  <div class="actions">
    <button id="refreshQr" type="button" class="primary">刷新客户端二维码</button>
  </div>
</section>

<small>所有认证与 VPN 隧道均在服务器官方 aTrust 客户端完成。验证完成或超时后，登录网页服务将自动关闭。</small>
</main>
<script>
const badge = document.getElementById('clientBadge');
const socksInfo = document.getElementById('socksInfo');
const socksAddress = document.getElementById('socksAddress');
const socksPort = document.getElementById('socksPort');
const socksAuth = document.getElementById('socksAuth');
const socksScope = document.getElementById('socksScope');
const tabPassword = document.getElementById('tabPassword');
const tabDingTalk = document.getElementById('tabDingTalk');
const panelPassword = document.getElementById('panelPassword');
const panelDingTalk = document.getElementById('panelDingTalk');
const usernameInput = document.getElementById('username');
const domainInput = document.getElementById('domain');
const passwordInput = document.getElementById('password');
const captchaStage = document.getElementById('captchaStage');
const captchaImg = document.getElementById('captchaImg');
const pwdStatus = document.getElementById('pwdStatus');
const loadCaptchaBtn = document.getElementById('loadCaptcha');
const undoBtn = document.getElementById('undoPoint');
const clearBtn = document.getElementById('clearPoints');
const submitPwdBtn = document.getElementById('submitPassword');
const qrImg = document.getElementById('qr');
const qrStatus = document.getElementById('qrStatus');
const refreshQrBtn = document.getElementById('refreshQr');

let mode = 'password';
let pending = false;
let serviceClosed = false;
let timer = null;
let captcha = null;
let points = [];
const DEFAULT_PWD_HINT = '点击“获取 / 刷新验证码”从服务器官方客户端加载图形验证码，再依次点选提交。';

function setBadge(status) {
  badge.textContent = '客户端：' + (status || '未知');
  badge.className = 'badge' + (['online', 'login'].includes(status) ? ' online' : '');
}

function setBox(element, text, kind = '') {
  element.textContent = text;
  element.className = 'status' + (kind ? ' ' + kind : '');
}

function hideCaptchaStage() {
  captchaStage.hidden = true;
  captchaImg.removeAttribute('src');
}

function showSocksInfo(socks5) {
  if (!socks5 || !Number.isInteger(socks5.port)) {
    socksInfo.hidden = true;
    return;
  }
  const host = typeof socks5.host === 'string' && socks5.host ? socks5.host : '127.0.0.1';
  socksAddress.textContent = host + ':' + socks5.port;
  socksPort.textContent = String(socks5.port);
  socksAuth.textContent = '无账号密码';
  socksScope.textContent = '仅允许本地连接（' + host + '）';
  socksInfo.hidden = false;
}

function formatConnectedMessage(prefix, socks5) {
  if (socks5 && Number.isInteger(socks5.port)) {
    const host = typeof socks5.host === 'string' && socks5.host ? socks5.host : '127.0.0.1';
    return prefix + '，SOCKS5 开放端口：' + host + ':' + socks5.port + '（无账号密码，仅允许本地连接），登录网页服务已自动关闭。';
  }
  return prefix + '，登录网页服务已自动关闭。';
}

function markServiceClosed(message, kind = 'ok', socks5 = null) {
  serviceClosed = true;
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
  captcha = null;
  points = [];
  hideCaptchaStage();
  qrImg.hidden = true;
  loadCaptchaBtn.disabled = true;
  undoBtn.disabled = true;
  clearBtn.disabled = true;
  submitPwdBtn.disabled = true;
  refreshQrBtn.disabled = true;
  showSocksInfo(socks5);
  setBox(pwdStatus, message, kind);
  setBox(qrStatus, message, kind);
}

function renderMarkers() {
  for (const node of captchaStage.querySelectorAll('.marker')) node.remove();
  if (!captcha || serviceClosed) {
    undoBtn.disabled = true;
    clearBtn.disabled = true;
    submitPwdBtn.disabled = true;
    return;
  }
  points.forEach((pt, idx) => {
    const dot = document.createElement('span');
    dot.className = 'marker';
    dot.textContent = String(idx + 1);
    dot.style.left = (pt[0] / captcha.width * 100) + '%';
    dot.style.top = (pt[1] / captcha.height * 100) + '%';
    captchaStage.appendChild(dot);
  });
  undoBtn.disabled = pending || points.length === 0;
  clearBtn.disabled = pending || points.length === 0;
  submitPwdBtn.disabled = pending || points.length === 0;
}

function setMode(nextMode) {
  mode = nextMode;
  const isPwd = mode === 'password';
  tabPassword.classList.toggle('active', isPwd);
  tabPassword.setAttribute('aria-selected', String(isPwd));
  tabDingTalk.classList.toggle('active', !isPwd);
  tabDingTalk.setAttribute('aria-selected', String(!isPwd));
  panelPassword.hidden = !isPwd;
  panelDingTalk.hidden = isPwd;
  if (!serviceClosed) pollStatus();
}

async function pollStatus() {
  if (pending || serviceClosed) return;
  try {
    const response = await fetch('/status?mode=' + mode);
    const data = await response.json();
    if (response.status === 503) {
      markServiceClosed(data.error || '登录网页服务已自动关闭。如需重新登录，请重启容器。', 'err');
      return;
    }
    if (!response.ok) throw new Error(data.error || '读取状态失败');
    setBadge(data.status);
    if (['online', 'login'].includes(data.status) || data.closing) {
      markServiceClosed(formatConnectedMessage('aTrust 客户端状态：' + data.status + '，已连接', data.socks5), 'ok', data.socks5);
      return;
    }
    if (mode === 'dingtalk') {
      qrImg.hidden = !data.image;
      if (data.image) {
        qrImg.src = data.image;
        setBox(qrStatus, '这是服务器官方 aTrust 客户端当前二维码，请使用钉钉扫码确认。');
      } else {
        setBox(qrStatus, '官方客户端尚未显示二维码，请点击“刷新客户端二维码”。');
      }
    } else if (pwdStatus.classList.contains('err')) {
      setBox(pwdStatus, DEFAULT_PWD_HINT);
    }
  } catch (error) {
    if (!serviceClosed) {
      setBox(mode === 'password' ? pwdStatus : qrStatus, '无法连接登录服务（可能已完成验证或超时自动关闭；如需重新登录，请重启容器）。', 'err');
    }
  }
}

async function fetchCaptcha() {
  if (pending || serviceClosed) return;
  pending = true;
  loadCaptchaBtn.disabled = true;
  renderMarkers();
  setBox(pwdStatus, '正在从服务器官方客户端获取验证码…');
  try {
    const response = await fetch('/password/captcha', { method: 'POST' });
    const data = await response.json();
    if (response.status === 503) {
      markServiceClosed(data.error || '登录网页服务已自动关闭。如需重新登录，请重启容器。', 'err');
      return;
    }
    if (data.status) setBadge(data.status);
    if (data.closing || ['online', 'login'].includes(data.status)) {
      markServiceClosed(formatConnectedMessage('aTrust 客户端状态：' + data.status + '，已连接', data.socks5), 'ok', data.socks5);
      return;
    }
    if (!response.ok) throw new Error(data.error || '获取验证码失败');
    captcha = { challenge: data.challenge, width: data.width, height: data.height };
    points = [];
    captchaImg.src = data.image;
    captchaStage.hidden = false;
    setBox(pwdStatus, '请按图片提示依次点选目标位置，然后点击“提交密码登录”。');
  } catch (error) {
    captcha = null;
    points = [];
    hideCaptchaStage();
    setBox(pwdStatus, error.message, 'err');
  } finally {
    pending = false;
    loadCaptchaBtn.disabled = serviceClosed;
    renderMarkers();
  }
}

async function submitPasswordLogin() {
  if (pending || !captcha || serviceClosed) return;
  const username = usernameInput.value.trim();
  const domain = domainInput.value.trim();
  const password = passwordInput.value;
  if (!username || !password) {
    setBox(pwdStatus, '请先填写账号和密码。', 'err');
    return;
  }
  if (!points.length) {
    setBox(pwdStatus, '请先在验证码图片上点选位置。', 'err');
    return;
  }
  pending = true;
  loadCaptchaBtn.disabled = true;
  renderMarkers();
  setBox(pwdStatus, '正在向服务器官方客户端提交密码与验证码…');
  try {
    const response = await fetch('/password/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username,
        domain,
        password,
        challenge: captcha.challenge,
        width: captcha.width,
        height: captcha.height,
        coordinates: points,
      }),
    });
    const data = await response.json();
    captcha = null;
    points = [];
    hideCaptchaStage();
    if (data.status) setBadge(data.status);
    if (response.status === 503) {
      markServiceClosed(data.error || '登录网页服务已自动关闭。如需重新登录，请重启容器。', 'err');
      return;
    }
    if (response.ok && data.ok) {
      passwordInput.value = '';
      if (data.closing || ['online', 'login'].includes(data.status)) {
        markServiceClosed(formatConnectedMessage('连接成功，客户端状态：' + (data.status || 'online'), data.socks5), 'ok', data.socks5);
      } else {
        setBox(pwdStatus, '密码与验证码校验成功，正在等待官方客户端完成连接…', 'ok');
        setTimeout(pollStatus, 800);
      }
    } else {
      setBox(pwdStatus, (data.error || '登录失败') + '（验证码已失效，请重新获取）', 'err');
    }
  } catch (error) {
    setBox(pwdStatus, error.message, 'err');
  } finally {
    pending = false;
    loadCaptchaBtn.disabled = serviceClosed;
    renderMarkers();
  }
}

async function refreshDingTalk() {
  if (pending || serviceClosed) return;
  pending = true;
  refreshQrBtn.disabled = true;
  setBox(qrStatus, '正在通知服务器官方客户端刷新钉钉二维码…');
  try {
    const response = await fetch('/refresh', { method: 'POST' });
    const data = await response.json();
    if (response.status === 503) {
      markServiceClosed(data.error || '登录网页服务已自动关闭。如需重新登录，请重启容器。', 'err');
      return;
    }
    if (data.status) setBadge(data.status);
    if (data.closing || ['online', 'login'].includes(data.status)) {
      markServiceClosed(formatConnectedMessage('aTrust 客户端状态：' + data.status + '，已连接', data.socks5), 'ok', data.socks5);
      return;
    }
    if (!response.ok) throw new Error(data.error || '刷新失败');
    qrImg.hidden = !data.image;
    if (data.image) {
      qrImg.src = data.image;
      setBox(qrStatus, '已获取服务器最新钉钉二维码，请使用钉钉扫码确认。');
    } else {
      setBox(qrStatus, '已触发官方客户端打开钉钉登录，等待二维码生成…');
    }
  } catch (error) {
    qrImg.hidden = true;
    setBox(qrStatus, error.message, 'err');
  } finally {
    pending = false;
    refreshQrBtn.disabled = serviceClosed;
  }
}

captchaImg.addEventListener('click', event => {
  if (!captcha || pending || points.length >= 10) return;
  const rect = captchaImg.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const x = Math.max(0, Math.min(captcha.width - 1, Math.round((event.clientX - rect.left) * captcha.width / rect.width)));
  const y = Math.max(0, Math.min(captcha.height - 1, Math.round((event.clientY - rect.top) * captcha.height / rect.height)));
  points.push([x, y]);
  renderMarkers();
});

tabPassword.addEventListener('click', () => setMode('password'));
tabDingTalk.addEventListener('click', () => setMode('dingtalk'));
loadCaptchaBtn.addEventListener('click', fetchCaptcha);
undoBtn.addEventListener('click', () => { points.pop(); renderMarkers(); });
clearBtn.addEventListener('click', () => { points = []; renderMarkers(); });
submitPwdBtn.addEventListener('click', submitPasswordLogin);
refreshQrBtn.addEventListener('click', refreshDingTalk);
timer = setInterval(pollStatus, 3000);
pollStatus();
</script>
</html>
