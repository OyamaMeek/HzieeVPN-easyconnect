name: hziee-headless
services:
  vpn:
    image: mythologyli/zju-connect:1.3.1
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./headless.toml
        target: /home/nonroot/config.toml
        read_only: true
        bind:
          create_host_path: false
      - ./headless-data:/home/nonroot/data
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:8888:8888"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
